services:
  postgres:
    image: postgres:16
    container_name: aiassistant-postgres
    environment:
      POSTGRES_DB: aiassistant
      POSTGRES_USER: aiassistant
      POSTGRES_PASSWORD: aiassistant_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aiassistant-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: