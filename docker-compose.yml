services:
  postgres:
    image: postgres:16

    container_name: khub-postgres

    environment:
      POSTGRES_DB: khub
      POSTGRES_USER: khub
      POSTGRES_PASSWORD: khub_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khub -d khub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: