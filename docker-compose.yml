services:
  postgres:
    image: postgres:16
    container_name: khub-postgres
    environment:
      POSTGRES_DB: khub
      POSTGRES_USER: khub
      POSTGRES_PASSWORD: khub_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: